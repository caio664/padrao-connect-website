<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="650" viewBox="0 0 1920 650" fill="none">
  <defs>
    <linearGradient id="lavenderFadeA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E7C8FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#D9B7FF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="lavenderFadeB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F0D7FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F8E8FF" stop-opacity="0.03"/>
